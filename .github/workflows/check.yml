name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci && npm run build && npm run test:sites
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: lantu-desktop-web
          path: desktop/dist/client/
  native:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends python3-pyqt6 python3-pyqt6.qtwebengine ca-certificates
      - run: python3 linux/tests/test_bridge.py
      - run: for file in linux/*.sh scripts/*.sh; do bash -n "$file"; done
        shell: bash
